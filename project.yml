name: Interval
options:
  bundleIdPrefix: nl.madebysura
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Interval:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Interval
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [interval]
        UIBackgroundModes: [audio]
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: IntervalLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.madebysura.interval
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  IntervalLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
    info:
      path: Resources/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Interval Live
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.madebysura.interval.live
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  IntervalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Interval
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Interval.app/Interval"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Interval:
    build:
      targets:
        Interval: all
        IntervalTests: [test]
    test:
      targets: [IntervalTests]
