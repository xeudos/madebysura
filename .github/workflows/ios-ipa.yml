name: Build Interval IPA
on:
  push:
    branches: [interval-timer-export]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: interval-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source from tested app branch
        run: git diff --exit-code bbe26b351d07ddef32834fb7349ff5c01f82be0f HEAD -- Sources Shared LiveActivity Tests Resources project.yml scripts
      - name: Set up Node for REA
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Prepare Xcode project and icon
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          swift scripts/GenerateIcon.swift
          xcodegen generate
      - name: Build arm64 iPhone app
        run: |
          set -euo pipefail
          xcodebuild build -project Interval.xcodeproj -scheme Interval -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/device.log
      - name: Package and verify IPA
        run: |
          set -euo pipefail
          mkdir -p build/package/Payload
          ditto build/device/Build/Products/Release-iphoneos/Interval.app build/package/Payload/Interval.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/package/Payload/Interval.app/Info.plist
          lipo -info build/package/Payload/Interval.app/Interval
          cd build/package
          zip -qry ../Interval-unsigned.ipa Payload
          cd ../..
          shasum -a 256 build/Interval-unsigned.ipa > build/Interval-unsigned.ipa.sha256
          python3 -c 'import plistlib, zipfile; z=zipfile.ZipFile("build/Interval-unsigned.ipa"); assert "Payload/Interval.app/Interval" in z.namelist(); assert z.testzip() is None; assert z.read("Payload/Interval.app/PlugIns/IntervalLiveActivity.appex/IntervalLiveActivity")[:4] == bytes.fromhex("cffaedfe"); assert plistlib.loads(z.read("Payload/Interval.app/Info.plist"))["NSSupportsLiveActivities"]'
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Interval-unsigned-IPA
          path: |
            build/Interval-unsigned.ipa
            build/Interval-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Save downloadable IPA on app branch
        run: |
          set -euo pipefail
          mkdir -p Downloads
          cp build/Interval-unsigned.ipa Downloads/Interval-unsigned.ipa
          shasum -a 256 Downloads/Interval-unsigned.ipa > Downloads/Interval-unsigned.ipa.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Downloads
          if ! git diff --cached --quiet; then
            git commit -m "Update downloadable Interval IPA [skip ci]"
            git push origin HEAD:interval-timer-export
          fi
      - name: Inspect built IPA with REA
        run: |
          set -euo pipefail
          mkdir -p build/rea
          npm exec --yes --package=rea-agents@6.8.0 -- rea --version > build/rea/version.txt
          npm exec --yes --package=rea-agents@6.8.0 -- rea inspect-artifact "$PWD/build/Interval-unsigned.ipa" --json > build/rea/ipa-evidence.json 2> build/rea/ipa-stderr.txt
          npm exec --yes --package=rea-agents@6.8.0 -- rea inspect-plist "$PWD/build/package/Payload/Interval.app/Info.plist" --json > build/rea/plist-evidence.json 2> build/rea/plist-stderr.txt
      - name: Upload build logs, tests, and REA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Interval-build-evidence
          path: |
            build/*.log
            build/app-preview-*
            build/Tests.xcresult
            build/rea
          retention-days: 14
